<div #scrollContainer class="messages-scroll d-flex flex-column gap-2" (copy)="onCopy($event)">
    @for (msg of messages; track msg) {
      <div class="message-bubble px-3 py-1 rounded-4"
           [class]="msg.role === 'user' ? 'bg-light align-self-end text-dark' : 'bg-primary align-self-start text-white'">
        <markdown [data]="msg.content"></markdown>
      </div>
    }
    @if (isLoading) {
      <app-loading></app-loading>
    }
</div>
