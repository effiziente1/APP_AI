<!-- Error Alert: show ALL validation + API errors -->
@if (messages().length > 0) {
<div class="alert alert-danger d-flex align-items-start gap-2" role="alert">
    <ng-icon name="lucideTriangleAlert" size="1.1em" class="mt-1 flex-shrink-0" />
    <ul class="mb-0 ps-3">@for (msg of messages(); track $index) {<li>{{ msg }}</li>}</ul>
</div>
}
