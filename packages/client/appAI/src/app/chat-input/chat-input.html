<div class="d-flex flex-column align-items-end gap-2 p-2 chat-input">
    <form [formRoot]="promptForm" class="w-100">
        <div class="w-100">
            <textarea (keydown)="onKeydown($event)"
                class="form-control"
                placeholder="Ask anything"
                [formField]="promptForm.prompt"
                rows="1"
                autofocus></textarea>
            @if (promptForm.prompt().dirty()) {
                @for (error of promptForm.prompt().errors(); track error.kind) {
                    <div class="text-danger small">{{ error.message }}</div>
                }
            }
        </div>
    </form>
    <button type="button" aria-label="Send" (click)="sendMessage()" class="btn btn-dark rounded-circle send-btn"
        [disabled]="promptForm().invalid() || isLoading()">
        <ng-icon name="lucideArrowUp" size="1.1em" />
    </button>
</div>
